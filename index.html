<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המשימות של נדב</title>
<meta name="theme-color" content="#2457C5">
<meta name="description" content="ניהול משימות אישי – לוח יומי, שבוע וחודש, מסונכרן בין טלפון למחשב">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F3EF; --card:#FFFFFF; --ink:#1B1F24; --ink2:#4A5260; --ink3:#7A818C;
  --line:#E3E1DA; --line2:#ECEAE4; --grid:#CFCBC1; --grid-half:#E4E1D9; --accent:#2457C5; --accent-soft:#E6ECFA;
  --todo-bg:#FDEBD8; --todo-bd:#E07B1F; --todo-fg:#8A3D06;
  --bad-bg:#FBE1E0;  --bad-bd:#D33A2C;  --bad-fg:#8F1D14;
  --done-bg:#E0F3E7; --done-bd:#1E9A52; --done-fg:#145A32;
  --appr-bg:#DDF1FB; --appr-bd:#1D9BD7; --appr-fg:#0B5A80;
  --radius:12px; --shadow:0 1px 2px rgba(27,31,36,.06),0 2px 8px rgba(27,31,36,.05);
  --shadow-lg:0 12px 40px rgba(27,31,36,.18);
  --ticker-h:40px; --tabbar-h:0px; --hour:60px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--ticker-h) + var(--tabbar-h) + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:rgba(244,243,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.seg{display:flex;background:#E9E7E0;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg button.soon{opacity:.75}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;right:10px;color:var(--ink3);pointer-events:none}
.search input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 36px 9px 32px;width:240px;min-height:42px}
.search .clr{position:absolute;left:4px;border:0;background:transparent;width:32px;height:32px;display:grid;place-items:center;color:var(--ink3);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;color:var(--ink);white-space:nowrap}
a.btn{text-decoration:none}
.btn:hover{border-color:#cfccc3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4aad}
.btn.danger{color:var(--bad-fg);border-color:#f0c4c0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:0;width:42px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{background:#FFF6E0;border-bottom:1px solid #F0DDAE;color:#6B4E00;font-size:13.5px;padding:7px 20px;display:flex;align-items:center;gap:8px;justify-content:center}
.srow{max-width:1600px;margin:0 auto;padding:0 20px 10px;position:relative}
.srow .sbox{position:relative;display:flex;align-items:center}
.srow input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.srow .sbox .sic{display:grid;position:absolute;right:14px;color:var(--ink3);pointer-events:none}
.srow input{width:100%;border:1.5px solid var(--grid);background:#fff;border-radius:12px;padding:11px 44px 11px 44px;min-height:46px;font:inherit;font-size:15px}
.srow input:focus{outline:none;border-color:#1D9BD7;box-shadow:0 0 0 3px rgba(29,155,215,.18)}
.srow .clr{position:absolute;left:6px;border:0;background:transparent;width:36px;height:36px;display:grid;place-items:center;color:var(--ink3);border-radius:8px;cursor:pointer}
.sres{position:absolute;right:20px;left:20px;top:calc(100% - 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:min(60vh,440px);overflow:auto;z-index:40}
.sres-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink3);position:sticky;top:0;background:#fff}
.sres-h .sp{flex:1}
.sres-h button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.sres-it{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;border-bottom:1px solid #f0eee9;background:transparent;padding:10px 12px;font:inherit;cursor:pointer}
.sres-it:hover,.sres-it.hi{background:#F4F3EF}
.sres-it .dot{width:10px;height:10px;border-radius:50%;flex:none}
.sres-it .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres-it .mt{color:var(--ink3);font-size:12.5px;white-space:nowrap}
.sres-empty{padding:16px 12px;color:var(--ink3);font-size:14px}
.main{max-width:1600px;margin:0 auto;padding:18px 20px 24px}

/* ---------- common ---------- */
.h1{font-size:22px;font-weight:700;margin:0}
.sub{color:var(--ink3);font-size:13.5px}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#EFEEE9;color:var(--ink2);white-space:nowrap}
.tag.iec{background:#E8EEFB;color:#1E3F8F}
.tag.clients{background:#F1EBFA;color:#5B3592}
.tag.internal{background:#EEEDE8;color:#4A5260}
.tag.urgent{background:var(--bad-bg);color:var(--bad-fg)}
.tag.deadline{background:#FFF1CC;color:#7A5300}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* progress */
.prog{display:flex;align-items:center;gap:14px;margin:12px 0 18px}
.prog-bar{flex:1;height:12px;border-radius:999px;background:#E7E5DE;display:flex;overflow:hidden;gap:2px}
.prog-bar span{height:100%}
.prog-txt{font-weight:600;white-space:nowrap}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{border-radius:var(--radius);padding:10px;min-height:220px;border:2px dashed transparent;transition:border-color .12s,background .12s}
.col.over{border-color:currentColor}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 4px 10px}
.col-h .cnt{margin-inline-start:auto;background:rgba(255,255,255,.7);border-radius:999px;padding:1px 9px;font-size:13px}
.col .empty{font-size:13px;color:var(--ink3);text-align:center;padding:22px 6px;border:1px dashed rgba(0,0,0,.12);border-radius:10px}
.card{position:relative;background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);border-inline-start:4px solid var(--bd);cursor:pointer}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.4}
.card:hover{box-shadow:0 2px 4px rgba(27,31,36,.08),0 6px 16px rgba(27,31,36,.08)}
.card-t{font-weight:600;margin:0 0 4px;font-size:15px;word-break:break-word}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--ink2);font-size:13px;align-items:center}
.card-meta>span{display:inline-flex;align-items:center;gap:4px}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.chipwrap{position:relative;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500;min-height:32px}
.menu{position:absolute;top:calc(100% + 4px);inset-inline-start:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:170px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:10px;border-radius:8px;text-align:start;min-height:44px}
.menu button:hover,.menu button[aria-checked="true"]{background:#F3F2EE}
.strip{margin-top:20px}
.strip-h{display:flex;align-items:center;gap:8px;border:0;background:transparent;font-weight:600;padding:8px 0;min-height:44px}
.strip-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.strip-list .card{margin:0}

/* ---------- week ---------- */
.wk-wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.wk-wrap>div{min-width:0}
.side .panel{padding:12px}
.side h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--ink2)}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600}
.mini-h button{border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.mini-h button:hover{background:#F0EEE8}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.mini .dn{color:var(--ink3);padding:3px 0}
.mini button{border:0;background:transparent;border-radius:7px;height:32px;position:relative;padding:0}
.mini button.out{color:#B5B9C0}
.mini button.inweek{background:var(--accent-soft)}
.mini button.today{color:#fff;background:var(--accent);font-weight:600}
.mini button .has{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--todo-bd)}
.mini button.today .has{background:#fff}
.flt label{display:flex;align-items:center;gap:8px;padding:6px 2px;min-height:36px;cursor:pointer}
.flt input{width:18px;height:18px;accent-color:var(--accent)}
.flt .n{margin-inline-start:auto;color:var(--ink3);font-size:13px}
.wait{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.wait-it{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:grab;font-size:13.5px;border-inline-start:4px solid var(--bd);text-align:start}
.wait-empty{color:var(--ink3);font-size:13px}
.qadd{display:flex;gap:6px}
.qadd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:42px}
.wk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wk-top .h1{margin-inline-end:10px}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);cursor:pointer;min-height:42px}
.tgl input{width:18px;height:18px;accent-color:var(--accent)}
.wk-scroll{overflow-x:auto;background:#fff;border:1px solid var(--grid);border-radius:var(--radius);box-shadow:var(--shadow)}
.wk{min-width:640px}
.wk-row{display:grid}
.wk-dh{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--grid)}
.wk-dh .d1{font-size:13px;color:var(--ink3)}
.wk-dh .d2{font-size:20px;font-weight:600;line-height:1.2}
.wk-dh.today .d2{color:#fff;background:var(--accent);border-radius:999px;display:inline-block;min-width:34px;padding:0 6px}
.wk-dh.today .d1{color:var(--accent);font-weight:600}
.wk-ad{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--grid);padding:4px;min-height:44px;display:flex;flex-direction:column;gap:3px}
.wk-ad.over,.wk-day.over{background:#F1F5FF}
.wk-adl{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid var(--line);padding:2px}
.pill{border:0;border-inline-start:3px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 6px;font-size:12.5px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-height:24px;width:100%}
.wk-gut{position:relative}
.wk-gut span{position:absolute;inset-inline-end:8px;transform:translateY(-50%);font-size:11.5px;color:var(--ink3)}
.wk-day{position:relative;border-inline-start:1px solid var(--grid);background-image:repeating-linear-gradient(to bottom,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent var(--hour)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour)/2),var(--grid-half) calc(var(--hour)/2),var(--grid-half) calc(var(--hour)/2 + 1px),transparent calc(var(--hour)/2 + 1px),transparent var(--hour));cursor:copy}
.wk-day.istoday{background-color:#FAFBFF}
.blk{position:absolute;border-radius:7px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-inline-start:4px solid var(--bd);padding:3px 6px;font-size:12.5px;overflow:hidden;cursor:grab;text-align:start;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.blk .bt{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.blk.short .bt{white-space:nowrap}
.blk .bm{opacity:.85;font-size:11.5px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.blk.dragging{opacity:.35}
.blk.flash{animation:flash 1.4s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(36,87,197,0)}50%{box-shadow:0 0 0 4px rgba(36,87,197,.45)}}
.now{position:absolute;inset-inline:0;height:2px;background:#D33A2C;pointer-events:none;z-index:5}
.now::before{content:"";position:absolute;inset-inline-start:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#D33A2C}
.ghost-slot{position:absolute;inset-inline:2px;height:15px;background:rgba(36,87,197,.12);border-radius:4px;pointer-events:none}

/* ---------- month ---------- */
.mo-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.mo .dn{padding:8px;text-align:center;font-size:13px;color:var(--ink3);border-bottom:1px solid var(--line)}
.mo-c{min-height:116px;border-bottom:1px solid var(--grid);border-inline-start:1px solid var(--grid);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:start;background:#fff;border-top:0;border-inline-end:0;font:inherit}
.mo-c:hover{background:#FAFAF7}
.mo-c.out{background:#FAF9F6;color:#A3A8B0}
.mo-n{font-size:13px;font-weight:600;align-self:flex-start;min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center}
.mo-c.today .mo-n{background:var(--accent);color:#fff}
.mo-more{font-size:12px;color:var(--ink3);padding-inline-start:4px}

/* ---------- agenda (mobile) ---------- */
.ag-strip{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr)) 36px;gap:3px;align-items:center;margin:4px 0 10px}
.ag-strip .nav{border:0;background:transparent;height:44px;border-radius:8px;display:grid;place-items:center}
.ag-day{border:1px solid transparent;background:#fff;border-radius:10px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.ag-day .w{font-size:11.5px;color:var(--ink3)}
.ag-day .n{font-weight:600;font-size:16px}
.ag-day .ds{display:flex;gap:2px;height:6px}
.ag-day .ds i{width:5px;height:5px;border-radius:50%}
.ag-day.sel{border-color:var(--accent);background:var(--accent-soft)}
.ag-day.today .n{color:var(--accent)}
.ag-list .card{margin-bottom:10px}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;min-height:36px;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2)}
.fab{position:fixed;left:16px;bottom:calc(var(--ticker-h) + var(--tabbar-h) + 14px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 18px rgba(36,87,197,.4);z-index:25}
.fab .ico{width:26px;height:26px}

/* ---------- mail placeholder ---------- */
.mail{max-width:640px;margin:20px auto;padding:28px;text-align:center}
.mail .big{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.mail .big .ico{width:32px;height:32px}
.mail ol{text-align:start;color:var(--ink2);line-height:1.8;padding-inline-start:20px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(27,31,36,.38);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .12s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(620px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.sm{width:min(400px,100%)}
.ov.top{z-index:70}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.m-h h2{margin:0;font-size:18px;flex:1}
.m-b{padding:16px 18px;overflow:auto}
.m-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.fld{margin-bottom:14px}
.fld>label,.fld>.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
textarea.inp{min-height:80px;resize:vertical}
.inp.title{font-size:17px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.stsel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stsel button{border:1.5px solid var(--bd);background:#fff;color:var(--fg);border-radius:10px;padding:8px 4px;min-height:44px;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.stsel button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--bd)}
.sw{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 0;min-height:44px}
.sw .tr{width:42px;height:24px;border-radius:999px;background:#D7D5CE;position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"] .tr{background:var(--accent)}
.sw[aria-checked="true"] .tr::after{right:21px}
.err{color:var(--bad-fg);font-size:13px;margin-top:4px}

.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,100%);background:#fff;z-index:61;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .16s ease}
@keyframes slidein{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{margin:0;font-size:19px;flex:1;word-break:break-word}

function createLocalStore() {
  let tasks = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) tasks = JSON.parse(raw).map(normRow); } catch (e) { tasks = null; }
  if (!Array.isArray(tasks)) tasks = seedTasks();
  const subs = new Set();
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(tasks)); } catch (e) { /* אחסון חסום – ממשיכים בזיכרון */ } };
  const emit = () => { persist(); subs.forEach((f) => f(tasks)); };
  persist();
  return {
    mode: 'local',
    async init() {},
    destroy() {},
    subscribe(f) { subs.add(f); f(tasks); return () => subs.delete(f); },
    async create(t) {
      const now = new Date().toISOString();
      const row = normRow({ ...blankTask(), ...t, id: uuid(), created_at: now, updated_at: now });
      tasks = [...tasks, row]; emit(); return row;
    },
    async update(id, patch) {
      tasks = tasks.map((x) => x.id === id ? normRow({ ...x, ...patch, updated_at: new Date().toISOString() }) : x); emit();
    },
    async remove(id) { tasks = tasks.filter((x) => x.id !== id); emit(); },
  };
}

function createSupabaseStore(sb, user) {
  let tasks = [];
  let channel = null;
  const subs = new Set();
  const emit = () => subs.forEach((f) => f(tasks));
  const put = (row) => {
    row = normRow(row);
    const i = tasks.findIndex((t) => t.id === row.id);
    tasks = i < 0 ? [...tasks, row] : tasks.map((t) => t.id === row.id ? row : t);
    emit();
  };
  async function refresh() {
    const { data, error } = await sb.from('personal_tasks').select('*');
    if (error) throw error;
    tasks = (data || []).map(normRow); emit();
  }
  const onVis = () => { if (document.visibilityState === 'visible') refresh().catch(() => {}); };
  return {
    mode: 'supabase',
    async init() {
      await refresh();
      channel = sb.channel('personal-tasks-' + user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'personal_tasks', filter: 'user_id=eq.' + user.id }, (p) => {
          if (p.eventType === 'DELETE') { tasks = tasks.filter((t) => t.id !== (p.old && p.old.id)); emit(); }
          else if (p.new) put(p.new);
        })
        .subscribe();
      document.addEventListener('visibilitychange', onVis);
    },
    destroy() { if (channel) sb.removeChannel(channel); document.removeEventListener('visibilitychange', onVis); },
    subscribe(f) { subs.add(f); f(tasks); return () => subs.delete(f); },
    async create(t) {
      const row = { ...blankTask(), ...t, id: uuid(), user_id: user.id };
      put({ ...row, created_at: new Date().toISOString() });
      const { data, error } = await sb.from('personal_tasks').insert(cleanForDb(row)).select().single();
      if (error) { tasks = tasks.filter((x) => x.id !== row.id); emit(); throw error; }
      put(data); return data;
    },
    async update(id, patch) {
      const prev = tasks.find((t) => t.id === id);
      if (prev) put({ ...prev, ...patch });
      const { data, error } = await sb.from('personal_tasks').update(cleanForDb(patch)).eq('id', id).select().single();
      if (error) { if (prev) put(prev); throw error; }
      put(data);
    },
    async remove(id) {
      const prev = tasks.find((t) => t.id === id);
      tasks = tasks.filter((t) => t.id !== id); emit();
      const { error } = await sb.from('personal_tasks').delete().eq('id', id);
      if (error) { if (prev) { tasks = [...tasks, prev]; emit(); } throw error; }
    },
  };
}

function shareLine(t, withDate) {
  const s = STATUS[t.status] || STATUS.todo;
  let l = `${s.emoji} *${t.title}*`;
  const when = [withDate && t.date ? dayLabel(t.date) : '', timeRange(t)].filter(Boolean).join(' ');
  if (when) l += ` (${when})`;
  const meta = [t.client && `לקוח: ${t.client}`, t.order_ref && `הזמנה: ${t.order_ref}`, t.urgent && 'דחוף', t.deadline && 'יעד'].filter(Boolean).join(' · ');
  if (meta) l += `\n      ${meta}`;
  return l;
}
function buildShare(scope, task, tasks, includeDone) {
  const t0 = todayStr();
  const keep = (x) => includeDone || !isDone(x);
  if (scope === 'task' && task) {
    const s = STATUS[task.status];
    let out = `*משימה – ${task.title}*\n${s.emoji} ${s.label}`;
    if (task.date) out += `\nמועד: ${dayLabel(task.date)}${task.start_time ? ' ' + timeRange(task) : ''}`;
    if (task.client) out += `\nלקוח: ${task.client}`;
    if (task.order_ref) out += `\nהזמנה: ${task.order_ref}`;
    out += `\nקטגוריה: ${CATS[task.category] || ''}`;
    if (task.urgent) out += '\nדחוף';
    if (task.notes) out += `\n\n${task.notes}`;
    return { subject: `משימה: ${task.title}`, text: out };
  }
  if (scope === 'week') {
    const ws = weekStartOf(t0);
    let out = `*משימות השבוע ${dm(ws)}-${dm(addDays(ws, 6))}*`;
    let any = 0, doneN = 0, total = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const all = tasks.filter((x) => x.date === d);
      total += all.length; doneN += all.filter(isDone).length;
      const list = all.filter(keep).sort(byTime);
      if (!list.length) continue;
      any++;
      out += `\n\n_יום ${DAY_NAMES[i]} ${dm(d)}_\n` + list.map((x) => shareLine(x, false)).join('\n');
    }
    if (!any) out += '\n\nאין משימות להצגה.';
    out += `\n\nסה"כ ${total} · הושלמו ${doneN}`;
    return { subject: `משימות השבוע ${dm(ws)}-${dm(addDays(ws, 6))}`, text: out };
  }
  const all = tasks.filter((x) => x.date === t0);
  const list = all.filter(keep).sort(byTime);
  let out = `*משימות להיום – ${longDate(t0)}*\n\n` + (list.length ? list.map((x) => shareLine(x, false)).join('\n') : 'אין משימות להצגה.');
  out += `\n\nהושלמו ${all.filter(isDone).length} מתוך ${all.length}`;
  return { subject: `משימות להיום ${dm(t0)}`, text: out };
}
const waUrl = (text) => 'https://wa.me/?text=' + encodeURIComponent(text);
const mailUrl = (subject, text) => 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text.replace(/\*/g, '').replace(/(^|\n)_([^\n]*)_(?=\n|$)/g, '$1$2'));
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

/* ================= שבוע ================= */
function layoutDay(list) {
  const items = list.map((t) => {
    const s = toMin(t.start_time); let e = toMin(t.end_time);
    if (e == null || e <= s) e = s + 60;
    return { t, s, e };
  }).sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1, lanes = [];
  const flush = () => { const n = lanes.length; cluster.forEach((it) => { it.n = n; }); cluster = []; lanes = []; };
  for (const it of items) {
    if (it.s >= clusterEnd && cluster.length) flush();
    let lane = lanes.findIndex((end) => end <= it.s);
    if (lane < 0) { lane = lanes.length; lanes.push(it.e); } else lanes[lane] = it.e;
    it.lane = lane; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  }
  flush();
  return items;
}

function MiniMonth({ anchor, onPick, tasks, weekStart, days }) {
  const [m, setM] = useState(() => { const d = parseD(anchor); return { y: d.getFullYear(), mo: d.getMonth() }; });
  useEffect(() => { const d = parseD(anchor); setM({ y: d.getFullYear(), mo: d.getMonth() }); }, [anchor]);
  const first = fmtD(new Date(m.y, m.mo, 1));
  const gs = weekStartOf(first);
  const t0 = todayStr();
  const dated = useMemo(() => new Set(tasks.filter((t) => t.date && isOpen(t)).map((t) => t.date)), [tasks]);
  const shift = (n) => setM(({ y, mo }) => { const d = new Date(y, mo + n, 1); return { y: d.getFullYear(), mo: d.getMonth() }; });
  return (
    <div className="panel">
      <div className="mini-h">
        <button onClick={() => shift(-1)} aria-label="חודש קודם"><Icon name="chevR" sm /></button>
        <span>{MONTHS[m.mo]} {m.y}</span>
        <button onClick={() => shift(1)} aria-label="חודש הבא"><Icon name="chevL" sm /></button>
      </div>
      <div className="mini">
        {DAY_SHORT.map((d) => <span key={d} className="dn">{d}</span>)}
        {Array.from({ length: 42 }, (_, i) => {
          const d = addDays(gs, i); const dd = parseD(d);
          const inWeek = d >= weekStart && d < addDays(weekStart, days);
          return (
            <button key={d} className={(dd.getMonth() !== m.mo ? 'out ' : '') + (inWeek ? 'inweek ' : '') + (d === t0 ? 'today' : '')} onClick={() => onPick(d)} aria-label={longDate(d)}>
              {dd.getDate()}{dated.has(d) && <span className="has" />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function WeekView({ tasks, allTasks, act, anchor, setAnchor, showWeekend, setShowWeekend, focusId, isMobile, filter, setFilter }) {
  const ws = weekStartOf(anchor);
  const nDays = showWeekend ? 7 : 5;
  const days = Array.from({ length: nDays }, (_, i) => addDays(ws, i));
  const t0 = todayStr();
  const [over, setOver] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const [qa, setQa] = useState('');
  const [now, setNow] = useState(new Date());
  useEffect(() => { const i = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(i); }, []);

  const weekTasks = tasks.filter((t) => t.date && t.date >= ws && t.date < addDays(ws, 7));
  const visible = weekTasks.filter((t) => filter[t.status]);
  const waiting = tasks.filter((t) => !t.date && isOpen(t)).sort(byTime);
  const cols = `56px repeat(${nDays}, minmax(0,1fr))`;
  const gridH = (DAY_END - DAY_START) * PX_PER_MIN;

  useEffect(() => {
    if (!focusId) return;
    const el = document.getElementById('blk-' + focusId);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }, [focusId, anchor]);

  const startDrag = (e, t, offsetMin, dur) => {
    dragState.current = { id: t.id, offsetMin, dur };
    e.dataTransfer.setData('text/plain', t.id); e.dataTransfer.effectAllowed = 'move';
    setDraggingId(t.id);
  };
  const endDrag = () => { dragState.current = null; setDraggingId(null); setOver(null); };

  const dropOnGrid = (e, day) => {
    e.preventDefault(); setOver(null);
    const d = dragState.current; dragState.current = null; setDraggingId(null);
    if (!d) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const y = e.clientY - rect.top;
    let start = DAY_START + Math.round((y / PX_PER_MIN - d.offsetMin) / 15) * 15;
    start = Math.max(DAY_START, Math.min(start, DAY_END - Math.min(d.dur, DAY_END - DAY_START)));
    const end = Math.min(start + d.dur, 24 * 60 - 1);
    act.update(d.id, { date: day, start_time: fromMin(start), end_time: fromMin(end) }, `שובץ ל${dayLabel(day)} ${fromMin(start)}`);
  };
  const dropAllDay = (e, day) => {
    e.preventDefault(); setOver(null);
    const d = dragState.current; dragState.current = null; setDraggingId(null);
    if (d) act.update(d.id, { date: day, start_time: null, end_time: null }, `הועבר ל${dayLabel(day)} (ללא שעה)`);
  };
  const clickSlot = (e, day) => {
    if (e.target !== e.currentTarget) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const start = DAY_START + Math.floor((e.clientY - rect.top) / PX_PER_MIN / 15) * 15;
    act.newTask({ date: day, start_time: fromMin(start), end_time: fromMin(Math.min(start + 60, DAY_END)) });
  };
  const quickAdd = (e) => {
    e.preventDefault();
    const title = qa.trim(); if (!title) return;
    act.create({ title, date: null }, 'נוספה לממתינות לשיבוץ'); setQa('');
  };

  const nowMin = now.getHours() * 60 + now.getMinutes();
  const title = (() => { const a = parseD(ws), b = parseD(addDays(ws, nDays - 1)); return a.getMonth() === b.getMonth() ? `${a.getDate()}-${b.getDate()} ב${MONTHS[a.getMonth()]} ${a.getFullYear()}` : `${a.getDate()} ב${MONTHS[a.getMonth()]} – ${b.getDate()} ב${MONTHS[b.getMonth()]} ${b.getFullYear()}`; })();

  return (
    <section className="wk-wrap" aria-label="תצוגת שבוע">
      {!isMobile && (
        <aside className="side">
          <MiniMonth anchor={anchor} onPick={setAnchor} tasks={allTasks} weekStart={ws} days={nDays} />
          <div className="panel flt">
            <h3>סינון לפי סטטוס</h3>
            {STATUS_ORDER.map((s) => (
              <label key={s}>
                <input type="checkbox" checked={filter[s]} onChange={(e) => setFilter((f) => ({ ...f, [s]: e.target.checked }))} />
                <span className="dot" style={{ background: STATUS[s].bd }} />{STATUS[s].label}
                <span className="n">{weekTasks.filter((t) => t.status === s).length}</span>
              </label>
            ))}
          </div>
          <div className="panel">
            <h3>ממתינות לשיבוץ ({waiting.length})</h3>
            <div className="wait">
              {waiting.map((t) => (
                <button key={t.id} className="wait-it" style={stVars(t.status)} draggable="true" title="גרור ללוח השבוע"
                  onDragStart={(e) => startDrag(e, t, 0, 60)} onDragEnd={endDrag} onClick={() => act.open(t)} data-wait={t.id}>
                  {t.title}{t.client ? <span className="sub"> · {t.client}</span> : null}
                </button>
              ))}
              {!waiting.length && <div className="wait-empty">אין משימות שממתינות לשיבוץ.</div>}
            </div>
          </div>
          <form className="panel" onSubmit={quickAdd}>
            <h3><label htmlFor="qa">הוספה מהירה</label></h3>
            <div className="qadd">
              <input id="qa" value={qa} onChange={(e) => setQa(e.target.value)} placeholder="כותרת משימה ואנטר" />
              <button className="btn primary icon" type="submit" aria-label="הוספה"><Icon name="plus" /></button>
            </div>
          </form>
        </aside>
      )}
      <div>
        <div className="wk-top">
          <h1 className="h1">{title}</h1>
          <button className="btn icon" onClick={() => setAnchor(addDays(anchor, -7))} aria-label="שבוע קודם"><Icon name="chevR" /></button>
          <button className="btn" onClick={() => setAnchor(t0)}>היום</button>
          <button className="btn icon" onClick={() => setAnchor(addDays(anchor, 7))} aria-label="שבוע הבא"><Icon name="chevL" /></button>
          <span className="spacer" />
          <label className="tgl"><input type="checkbox" checked={showWeekend} onChange={(e) => setShowWeekend(e.target.checked)} />הצג שישי ושבת</label>
        </div>
        <div className="wk-scroll">
          <div className="wk">
            <div className="wk-row" style={{ gridTemplateColumns: cols }}>
              <div style={{ borderBottom: '1px solid var(--line)' }} />
              {days.map((d) => { const dd = parseD(d); return (
                <div key={d} className={'wk-dh' + (d === t0 ? ' today' : '')}>
                  <div className="d1">{DAY_NAMES[dd.getDay()]}</div><div className="d2">{dd.getDate()}</div>
                </div>); })}
            </div>
            <div className="wk-row" style={{ gridTemplateColumns: cols }}>
              <div className="wk-adl">יעד / ללא שעה</div>
              {days.map((d) => (
                <div key={d} className={'wk-ad' + (over === 'ad' + d ? ' over' : '')} data-allday={d}
                  onDragOver={(e) => { if (dragState.current) { e.preventDefault(); if (over !== 'ad' + d) setOver('ad' + d); } }}
                  onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }}
                  onDrop={(e) => dropAllDay(e, d)}>
                  {visible.filter((t) => t.date === d && !t.start_time).map((t) => (
                    <button key={t.id} id={'blk-' + t.id} className="pill" style={stVars(t.status)} draggable="true"
                      onDragStart={(e) => startDrag(e, t, 0, 60)} onDragEnd={endDrag} onClick={() => act.open(t)} title={t.title}>
                      {t.deadline && <Icon name="flag" sm />}{t.title}
                    </button>
                  ))}
                </div>
              ))}
            </div>
            <div className="wk-row" style={{ gridTemplateColumns: cols, height: gridH }}>
              <div className="wk-gut">
                {Array.from({ length: (DAY_END - DAY_START) / 60 + 1 }, (_, i) => (
                  <span key={i} style={{ top: Math.max(8, Math.min(gridH - 8, i * 60 * PX_PER_MIN)) }}>{pad(7 + i)}:00</span>
                ))}
              </div>
              {days.map((d) => (
                <div key={d} className={'wk-day' + (d === t0 ? ' istoday' : '') + (over === d ? ' over' : '')} data-day={d}
                  onClick={(e) => clickSlot(e, d)}
                  onDragOver={(e) => { if (dragState.current) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (over !== d) setOver(d); } }}
                  onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }}
                  onDrop={(e) => dropOnGrid(e, d)}>
                  {layoutDay(visible.filter((t) => t.date === d && t.start_time)).map(({ t, s, e, lane, n }) => {
                    const top = Math.max(0, Math.min(s, DAY_END - 20) - DAY_START) * PX_PER_MIN;
                    const h = Math.max(22, (Math.min(e, DAY_END) - Math.max(s, DAY_START)) * PX_PER_MIN - 2);
                    const w = 100 / n;
                    return (
                      <button key={t.id} id={'blk-' + t.id} className={'blk' + (h < 44 ? ' short' : '') + (draggingId === t.id ? ' dragging' : '') + (focusId === t.id ? ' flash' : '')}
                        style={{ ...stVars(t.status), top, height: h, insetInlineStart: `calc(${lane * w}% + 2px)`, width: `calc(${w}% - 4px)` }}
                        draggable="true"
                        onDragStart={(ev) => { const r = ev.currentTarget.getBoundingClientRect(); startDrag(ev, t, Math.round((ev.clientY - r.top) / PX_PER_MIN), e - s); }}
                        onDragEnd={endDrag}
                        onClick={(ev) => { ev.stopPropagation(); act.open(t); }}
                        title={`${timeRange(t)} ${t.title}`}>
                        <span className="bt">{t.urgent && <Icon name="alert" sm style={{ verticalAlign: '-3px', marginInlineEnd: 3 }} />}{t.title}</span>
                        {h > 34 && <span className="bm">{timeRange(t)}{t.client ? ' · ' + t.client : ''}</span>}
                      </button>
                    );
                  })}
                  {d === t0 && nowMin >= DAY_START && nowMin <= DAY_END && <div className="now" style={{ top: (nowMin - DAY_START) * PX_PER_MIN }} aria-hidden="true" />}
                </div>
              ))}
            </div>
          </div>
        </div>
        {isMobile && <p className="sub" style={{ marginTop: 10 }}>הקש על משבצת ריקה כדי להוסיף משימה. לשינוי מועד – פתח את המשימה ובחר "עריכה".</p>}
      </div>
    </section>
  );
}

const REMINDERS = [[null, 'ללא'], [0, 'בזמן'], [15, "15 דק'"], [30, "30 דק'"], [60, 'שעה'], [1440, 'יום לפני']];
const remindLabel = (m) => { const r = REMINDERS.find(([v]) => v === m); return r ? (m === 0 ? 'בזמן המשימה' : m === 1440 ? 'יום לפני' : r[1] + ' לפני') : ''; };

function EditForm({ initial, act, onClose }) {
  const isNew = !initial.id;
  const [f, setF] = useState(() => ({ ...blankTask(), ...initial, notes: initial.notes || '', client: initial.client || '', order_ref: initial.order_ref || '' }));
  const [err, setErr] = useState('');
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const t0 = todayStr();
  const nextSunday = addDays(weekStartOf(t0), 7);
  const quick = [['היום', t0], ['מחר', addDays(t0, 1)], ["יום א' הבא", nextSunday], ['+שבוע', addDays(f.date || t0, 7)], ['ללא תאריך', null]];
  const save = async (e) => {
    e && e.preventDefault();
    if (!f.title.trim()) { setErr('חובה למלא כותרת'); return; }
    let { start_time, end_time } = f;
    start_time = start_time || null; end_time = end_time || null;
    if (start_time && end_time && toMin(end_time) <= toMin(start_time)) { setErr('שעת הסיום חייבת להיות אחרי שעת ההתחלה'); return; }
    if (!f.date) { start_time = null; end_time = null; }
    const data = { ...f, title: f.title.trim(), start_time, end_time, remind_minutes: f.date ? (f.remind_minutes ?? null) : null };
    setSaving(true);
    const ok = isNew ? await act.create(data, 'המשימה נוספה') : await act.update(f.id, data, 'המשימה נשמרה');
    setSaving(false);
    if (ok !== false) onClose();
  };
  return (
    <Modal title={isNew ? 'משימה חדשה' : 'עריכת משימה'} onClose={onClose}
      footer={<>
        <button className="btn primary" onClick={save} disabled={saving}><Icon name="check" sm />שמירה</button>
        <button className="btn" onClick={onClose}>ביטול</button>
        <span className="spacer" />
        {!isNew && <button className="btn danger" onClick={() => act.askDelete(f)}><Icon name="trash" sm />מחיקה</button>}
      </>}>
      <form onSubmit={save}>
        <div className="fld">

function Ticker({ tasks, onPick }) {

const ATM_FILTERS = [['open', 'פתוחות'], ['today', 'היום'], ['week', 'השבוע'], ['all', 'הכל']];
function AllTasksMenu({ tasks, onPick, isMobile }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const [flt, setFlt] = useState('open');
  const [hi, setHi] = useState(0);
  const wrapRef = useRef(null), panelRef = useRef(null), btnRef = useRef(null), inputRef = useRef(null), listRef = useRef(null);
  const openCount = tasks.filter(isOpen).length;
  const t0 = todayStr();
  const ws = weekStartOf(t0), we = addDays(ws, 7);
  const match = {
    open: isOpen,
    today: (t) => t.date === t0,
    week: (t) => !!t.date && t.date >= ws && t.date < we,
    all: () => true,
  };
  const qq = q.trim().toLowerCase();
  const bySearch = (t) => !qq || [t.title, t.client, t.order_ref, t.notes].some((v) => v && String(v).toLowerCase().includes(qq));
  const list = open ? tasks.filter((t) => match[flt](t) && bySearch(t)).sort(byTime) : [];
  const counts = open ? Object.fromEntries(ATM_FILTERS.map(([k]) => [k, tasks.filter((t) => match[k](t) && bySearch(t)).length])) : {};

  const close = useCallback((refocus) => { setOpen(false); if (refocus && btnRef.current) btnRef.current.focus(); }, []);
  useEffect(() => { setHi(0); }, [q, flt, open]);
  useEffect(() => {
    if (!open) return;
    const id = setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
    const h = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      if (panelRef.current && panelRef.current.contains(e.target)) return;
      setOpen(false);
    };
    const k = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(true); } };
    document.addEventListener('pointerdown', h); document.addEventListener('keydown', k);
    return () => { clearTimeout(id); document.removeEventListener('pointerdown', h); document.removeEventListener('keydown', k); };
  }, [open, close]);
  useEffect(() => {
    if (!open || !listRef.current) return;
    const el = listRef.current.querySelector(`[data-i="${hi}"]`);
    if (el) el.scrollIntoView({ block: 'nearest' });
  }, [hi, open]);

  const pick = (t) => { setOpen(false); setQ(''); onPick(t); };
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setHi((i) => Math.min(list.length - 1, i + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((i) => Math.max(0, i - 1)); }
    else if (e.key === 'Home' && e.target.tagName !== 'INPUT') { e.preventDefault(); setHi(0); }
    else if (e.key === 'End' && e.target.tagName !== 'INPUT') { e.preventDefault(); setHi(list.length - 1); }
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); if (list[hi]) pick(list[hi]); }
  };
  const optId = (i) => 'atm-opt-' + i;

  const body = (
    <div ref={panelRef} className={isMobile ? 'atm-sheet' : 'atm-pop'} role="dialog" aria-label="כל המשימות" onKeyDown={onKey}>
      <div className="atm-top">
        {isMobile && <div className="atm-sh"><span>כל המשימות</span><button className="btn icon ghost" onClick={() => close(true)} aria-label="סגירה"><Icon name="x" /></button></div>}
        <div className="atm-q">
          <Icon name="search" sm />
          <input ref={inputRef} type="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="חיפוש משימה, לקוח, הזמנה"
            aria-label="חיפוש בכל המשימות" role="combobox" aria-expanded="true" aria-controls="atm-list" aria-autocomplete="list"
            aria-activedescendant={list[hi] ? optId(hi) : undefined} />
        </div>
        <div className="atm-seg" role="group" aria-label="סינון">
          {ATM_FILTERS.map(([k, l]) => <button key={k} type="button" aria-pressed={flt === k} onClick={() => { setFlt(k); inputRef.current && inputRef.current.focus(); }}>{l}<span className="n">{counts[k]}</span></button>)}
        </div>
      </div>
      {list.length ? (
        <ul className="atm-list" id="atm-list" role="listbox" ref={listRef} aria-label="משימות">
          {list.map((t, i) => (
            <li key={t.id} id={optId(i)} data-i={i} role="option" aria-selected={i === hi} className={'atm-it' + (t.status === 'approved' ? ' done' : '')}
              onMouseMove={() => { if (hi !== i) setHi(i); }} onClick={() => pick(t)}>
              <span className="dot" style={{ background: STATUS[t.status].bd }} title={STATUS[t.status].label} />
              <span className="tx">
                <span className="tt">{t.title}</span>
                {(t.client || t.order_ref) && <span className="mt">{[t.client, t.order_ref].filter(Boolean).join(' · ')}</span>}
              </span>
              {t.urgent && <span className="urg" title="דחוף"><Icon name="flag" sm /></span>}
              <span className={'wh' + (isLate(t) ? ' late' : '')}>{shortWhen(t)}</span>
            </li>
          ))}
        </ul>
      ) : <div className="atm-empty">{qq ? 'לא נמצאו משימות תואמות.' : 'אין משימות בסינון הזה.'}</div>}
      {!isMobile && <div className="atm-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> ניווט</span><span><kbd>Enter</kbd> פתיחה</span><span><kbd>Esc</kbd> סגירה</span></div>}
    </div>
  );

  return (
    <div className="atm" ref={wrapRef}>
      <button ref={btnRef} type="button" className="btn atm-btn" aria-haspopup="dialog" aria-expanded={open}
        aria-label={`כל המשימות – ${openCount} פתוחות`} onClick={() => setOpen((o) => !o)}>
        <Icon name="list" sm /><span className="lbl-t">כל המשימות</span><span className="cnt">{openCount}</span><span className="chev" style={{ display: 'flex' }}><Icon name="chevD" sm /></span>
      </button>
      {open && !isMobile && body}
      {open && isMobile && ReactDOM.createPortal(<><div className="atm-sheet-ov" onClick={() => close(false)} />{body}</>, document.body)}
    </div>
  );
}

/* ================= תצוגת רשימה ================= */
const LIST_LS = 'nadav-list-v1';
const GROUP_BY = [['date', 'לפי תאריך'], ['status', 'לפי סטטוס'], ['cat', 'לפי קטגוריה']];
function SearchRow({ value, setValue, results, onPick, onShowList }) {
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const boxRef = useRef(null);
  const q = value.trim();
  const list = useMemo(() => [...results].sort((a, b) => {
    const da = isDone(a) ? 1 : 0, db = isDone(b) ? 1 : 0;
    if (da !== db) return da - db;
    return String(a.date || '9999').localeCompare(String(b.date || '9999'));
  }).slice(0, 30), [results]);
  useEffect(() => { setHi(0); }, [value]);
  useEffect(() => {
    const h = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', h);
    return () => document.removeEventListener('pointerdown', h);
  }, []);
  const pick = (t) => { setOpen(false); onPick(t); };
  const onKey = (e) => {
    if (e.key === 'Escape') { if (open && q) setOpen(false); else setValue(''); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setHi((h) => Math.min(h + 1, list.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
    else if (e.key === 'Enter' && list[hi]) { e.preventDefault(); pick(list[hi]); }
  };
  const show = open && q;
  return (
    <div className="srow" ref={boxRef} role="search">
      <div className="sbox">
        <span className="sic"><Icon name="search" /></span>
        <input type="search" value={value} placeholder="חיפוש משימה: כותרת, לקוח, מספר הזמנה, הערות"
          aria-label="חיפוש משימות" onFocus={() => setOpen(true)}
          onChange={(e) => { setValue(e.target.value); setOpen(true); }} onKeyDown={onKey} />
        {value && <button className="clr" onClick={() => { setValue(''); setOpen(false); }} aria-label="ניקוי חיפוש"><Icon name="x" sm /></button>}
      </div>
      {show && (
        <div className="sres" role="listbox" aria-label="תוצאות חיפוש">
          <div className="sres-h">
            <span>{results.length ? `${results.length} משימות נמצאו` : 'לא נמצאו משימות'}</span>
            <span className="sp" />
            {results.length > 0 && <button onClick={() => { setOpen(false); onShowList(); }}>הצג הכל ברשימה</button>}
          </div>
          {list.length === 0 && <div className="sres-empty">נסה מילה אחרת, שם לקוח או מספר הזמנה</div>}
          {list.map((t, i) => (
            <button key={t.id} role="option" aria-selected={i === hi} className={'sres-it' + (i === hi ? ' hi' : '')}
              onMouseEnter={() => setHi(i)} onClick={() => pick(t)}>
              <span className="dot" style={{ background: (STATUS[t.status] || STATUS.todo).bd }} title={(STATUS[t.status] || STATUS.todo).label} />
              <span className="tt">{t.title}{t.client ? ' · ' + t.client : ''}</span>
              <span className="mt">{t.date ? dayLabel(t.date) : 'ללא תאריך'}{t.order_ref ? ' · ' + t.order_ref : ''}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const DATE_GROUPS = [['late', 'באיחור'], ['today', 'היום'], ['tomorrow', 'מחר'], ['week', 'השבוע'], ['later', 'בהמשך'], ['nodate', 'ללא תאריך'], ['done', 'הושלמו']];
function groupTasks(list, by) {
  if (by === 'status') return STATUS_ORDER.map((s) => ({ key: s, label: STATUS[s].label, color: STATUS[s].bd, items: list.filter((t) => t.status === s).sort(byTime) }));
  if (by === 'cat') {
    const keys = [...Object.keys(CATS), ...[...new Set(list.map((t) => t.category))].filter((c) => !CATS[c])];
    return keys.map((c) => ({ key: c, label: CATS[c] || c || 'ללא קטגוריה', items: list.filter((t) => t.category === c).sort(byTime) }));
  }
  const t0 = todayStr(), t1 = addDays(t0, 1), we = addDays(weekStartOf(t0), 7);
  const bucket = (t) => {
    if (isDone(t)) return 'done';
    if (!t.date) return 'nodate';
    if (t.date < t0) return 'late';
    if (t.date === t0) return 'today';
    if (t.date === t1) return 'tomorrow';
    if (t.date < we) return 'week';
    return 'later';
  };
  return DATE_GROUPS.map(([k, l]) => {
    const items = list.filter((t) => bucket(t) === k).sort(byTime);
    if (k === 'done') items.reverse();
    return { key: k, label: l, items };
  });
}

const rowWhen = (t) => {
  if (!t.date) return 'ללא תאריך';
  const t0 = todayStr();
  const d = (t.date === t0 || t.date === addDays(t0, 1)) ? dayLabel(t.date) : shortWhen({ date: t.date });
  return d + (t.start_time ? ' · ' + timeRange(t) : '');
};
function ListRow({ t, act }) {
  return (
    <div className={'lrow' + (t.status === 'approved' ? ' isdone' : '')} style={stVars(t.status)} role="button" tabIndex={0} data-id={t.id}
      onClick={() => act.open(t)} onKeyDown={(e) => { if (e.key === 'Enter' && e.target === e.currentTarget) act.open(t); }}>
      <StatusChip compact status={t.status} onChange={(s) => act.update(t.id, { status: s }, `סומן "${STATUS[s].label}"`)} />
      <div className="lrow-main">
        <div className="lrow-t">{t.urgent && <span className="urg" title="דחוף" aria-label="דחוף"><Icon name="flag" sm /></span>}<span>{t.title}</span></div>
        <div className="lrow-m">
          <span className={isLate(t) ? 'late' : ''}><Icon name="clock" sm />{rowWhen(t)}</span>
          {t.client && <span><Icon name="user" sm />{t.client}</span>}
          {t.order_ref && <span><Icon name="hash" sm />{t.order_ref}</span>}
        </div>
      </div>
      <div className="lrow-tags">
        <CatTag c={t.category} />
        {t.deadline && <span className="tag deadline"><Icon name="flag" sm />יעד</span>}
      </div>
    </div>
  );
}

function ListView({ tasks, act, filter, setFilter }) {
  const [prefs, setPrefs] = useState(() => {
    const p = lsGet(LIST_LS, {});
    return { group: GROUP_BY.some(([k]) => k === p.group) ? p.group : 'date', open: (p.open && typeof p.open === 'object') ? p.open : {} };
  });
  useEffect(() => { lsSet(LIST_LS, prefs); }, [prefs]);
  const by = prefs.group;
  const isOpenGrp = (k) => { const v = prefs.open[by + ':' + k]; return v === undefined ? !(by === 'date' && k === 'done') : v; };
  const setGrp = (k, v) => setPrefs((p) => (isOpenGrp(k) === v ? p : { ...p, open: { ...p.open, [by + ':' + k]: v } }));
  const shown = tasks.filter((t) => filter[t.status]);
  const groups = groupTasks(shown, by).filter((g) => g.items.length);
  const openN = shown.filter(isOpen).length;
  return (
    <section aria-label="רשימת משימות">
      <div className="ls-top">
        <h1 className="h1">כל המשימות <span className="sub">· {shown.length} משימות, {openN} פתוחות</span></h1>
        <span className="spacer" />
        <div className="ls-ctl">
          <span className="lbl" id="ls-gb">קיבוץ</span>
          <div className="ls-seg" role="group" aria-labelledby="ls-gb">
            {GROUP_BY.map(([k, l]) => <button key={k} type="button" aria-pressed={by === k} onClick={() => setPrefs((p) => ({ ...p, group: k }))}>{l}</button>)}
          </div>
        </div>
        <div className="ls-flt" role="group" aria-label="סינון לפי סטטוס">
          {STATUS_ORDER.map((s) => (
            <button key={s} type="button" style={stVars(s)} aria-pressed={!!filter[s]} onClick={() => setFilter((f) => ({ ...f, [s]: !f[s] }))}>
              <span className="dot" style={{ background: STATUS[s].bd }} />{STATUS[s].label}<span className="n">{tasks.filter((t) => t.status === s).length}</span>
            </button>
          ))}
        </div>
      </div>
      {groups.map((g) => (
        <details key={by + g.key} className={'lgrp' + (by === 'date' && g.key === 'late' ? ' late' : '')} open={isOpenGrp(g.key)} data-grp={g.key}
          onToggle={(e) => setGrp(g.key, e.currentTarget.open)}>
          <summary>
            <span className="chev" style={{ display: 'flex' }}><Icon name="chevD" sm /></span>
            {g.color && <span className="dot" style={{ background: g.color }} />}
            {by === 'date' && g.key === 'late' && <Icon name="alert" sm />}
            <span>{g.label}</span><span className="cnt">{g.items.length}</span>
          </summary>
          <div className="lrows">{g.items.map((t) => <ListRow key={t.id} t={t} act={act} />)}</div>
        </details>
      ))}
      {!groups.length && <div className="panel ls-empty">אין משימות להצגה{shown.length !== tasks.length ? ' – נסה לשנות את סינון הסטטוס' : ''}.</div>}
    </section>
  );
}

function App({ store, user, onLogout, sb }) {
  const isMobile = useIsMobile();
  const [tasks, setTasks] = useState([]);
  const [view, setView] = useState('today');
  const [search, setSearch] = useState('');
  const [drawerId, setDrawerId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [shareCtx, setShareCtx] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [pushOpen, setPushOpen] = useState(false);
  const [pushSt, pushCheck] = usePushState(sb);
  const [weekAnchor, setWeekAnchor] = useState(todayStr());
  const [monthAnchor, setMonthAnchor] = useState(todayStr());
  const [agendaDay, setAgendaDay] = useState(todayStr());
  const [showWeekend, setShowWeekend] = useState(() => { try { return localStorage.getItem('nadav-weekend') === '1'; } catch (e) { return false; } });
  const [focusId, setFocusId] = useState(null);
  const [stFilter, setStFilter] = useState({ todo: true, done: true, approved: true, bad: true });
  const toastTimer = useRef(null);

  useEffect(() => {
    const unsub = store.subscribe(setTasks);
    store.init().catch((e) => toast('שגיאה בטעינה: ' + (e.message || e)));
    return () => { unsub(); store.destroy(); };
  }, [store]);
  // פתיחת משימה מלחיצה על התראה
  const pendingOpen = useRef(null);
  useEffect(() => {
    try { const q = new URLSearchParams(location.search).get('task'); if (q) { pendingOpen.current = q; history.replaceState(null, '', location.pathname); } } catch (e) {}
    if (!('serviceWorker' in navigator)) return;
    const onMsg = (e) => { if (e.data && e.data.openTask) { pendingOpen.current = e.data.openTask; setTasks((x) => [...x]); } };
    navigator.serviceWorker.addEventListener('message', onMsg);
    return () => navigator.serviceWorker.removeEventListener('message', onMsg);
  }, []);
  useEffect(() => {
    const id = pendingOpen.current;
    if (!id) return;
    const t = tasks.find((x) => x.id === id);
    if (t) { pendingOpen.current = null; pickFromTicker(t); }
  }, [tasks]);
  useEffect(() => { try { localStorage.setItem('nadav-weekend', showWeekend ? '1' : '0'); } catch (e) {} }, [showWeekend]);

  const toast = useCallback((m) => {
    setToastMsg(m); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2400);
  }, []);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return tasks;
    return tasks.filter((t) => [t.title, t.client, t.order_ref, t.notes].some((v) => v && String(v).toLowerCase().includes(q)));
  }, [tasks, search]);

  const act = useMemo(() => ({
    open: (t) => setDrawerId(t.id),
    edit: (t) => { setDrawerId(null); setEditing(t); },
    newTask: (prefill) => setEditing({ ...blankTask(), ...prefill }),
    share: (t) => setShareCtx({ task: t || null }),
    async create(data, msg) {
      try { await store.create(data); if (msg) toast(msg); return true; } catch (e) { toast('שמירה נכשלה: ' + (e.message || e)); return false; }
    },
    async update(id, patch, msg) {
      try { await store.update(id, patch); if (msg) toast(msg); return true; } catch (e) { toast('עדכון נכשל: ' + (e.message || e)); return false; }
    },
    postpone(t) {
      const d = addDays(t.date || todayStr(), 1);
      act.update(t.id, { date: d }, `נדחה ל${dayLabel(d)}`);
    },
    askDelete(t) {
      setConfirm({
        text: `למחוק את המשימה "${t.title}"? אי אפשר לבטל.`,
        onYes: async () => {
          setConfirm(null); setDrawerId(null); setEditing(null);
          try { await store.remove(t.id); toast('המשימה נמחקה'); } catch (e) { toast('מחיקה נכשלה: ' + (e.message || e)); }
        },
      });
    },
  }), [store, toast]);

  const goWeek = (d) => { setWeekAnchor(d); setView('week'); };
  const pickFromTicker = (t) => {
    if (t.date) {
      setWeekAnchor(t.date);
      const wd = parseD(t.date).getDay();
      if (wd >= 5 && !showWeekend) setShowWeekend(true);
      setView('week');
      setFocusId(null); setTimeout(() => setFocusId(t.id), 30);
    }
    setDrawerId(t.id);
  };

  const drawerTask = drawerId && tasks.find((t) => t.id === drawerId);
  useEffect(() => { if (drawerId && !drawerTask && tasks.length) setDrawerId(null); }, [drawerId, drawerTask, tasks.length]);

  const views = [
    ['today', isMobile ? 'היום' : 'לוח היום', isMobile ? 'list' : 'board'],
    ['week', 'שבוע', 'week'],
    ['month', 'חודש', 'month'],
    ['list', 'רשימה', 'rows'],
    ['mail', 'מהמייל', 'inbox'],
  ];

  return (
    <>
      <header className="hdr">
        <div className="hdr-in">
          <div className="brand"><span className="brand-mark"><Icon name="check" /></span><span className="brand-t">המשימות של נדב</span></div>
          <nav className="seg" aria-label="תצוגות">
            {views.map(([k, l, ic]) => <button key={k} aria-pressed={view === k} className={k === 'mail' ? 'soon' : ''} onClick={() => setView(k)} aria-label={l} title={l}><Icon name={ic} sm /><span className="lbl-v">{l}</span></button>)}
          </nav>
          <span className="spacer" />
          <AllTasksMenu tasks={tasks} onPick={pickFromTicker} isMobile={isMobile} />
          <button className="btn desk" onClick={() => setShareCtx({ task: null })}><Icon name="share" sm /><span className="lbl-d">שיתוף</span></button>
          <button className="btn primary desk" onClick={() => act.newTask({ date: view === 'today' ? todayStr() : null })} aria-label="משימה חדשה"><Icon name="plus" sm /><span className="lbl-d">משימה חדשה</span></button>
          {isMobile && <button className="btn icon ghost" onClick={() => setShareCtx({ task: null })} aria-label="שיתוף"><Icon name="share" /></button>}
          {sb && <button className="btn icon ghost" onClick={() => setPushOpen(true)} aria-label="תזכורות בטלפון" title={pushSt.on ? 'תזכורות פעילות' : 'הפעלת תזכורות בטלפון'} style={{ position: 'relative' }}><Icon name="bell" />{pushSt.ready && !pushSt.on && <span style={{ position: 'absolute', top: 8, insetInlineEnd: 8, width: 8, height: 8, borderRadius: 4, background: '#E07B1F' }} />}</button>}
          {onLogout && <button className="btn icon ghost" onClick={onLogout} aria-label="התנתקות" title={user && user.email}><Icon name="logout" /></button>}
        </div>
        <SearchRow value={search} setValue={setSearch} results={filtered} onPick={(t) => { pickFromTicker(t); }} onShowList={() => setView('list')} />
      </header>
      {store.mode === 'local' && <div className="banner" role="status"><Icon name="cloud" sm />מצב מקומי – חבר את Supabase לסנכרון</div>}

      <main className="main">
        {search && <p className="sub" style={{ marginTop: 0 }}>מסונן לפי "{search}" · {filtered.length} משימות</p>}
        {view === 'today' && (isMobile
          ? <Agenda tasks={filtered} act={act} day={agendaDay} setDay={setAgendaDay} />
          : <TodayBoard tasks={filtered} act={act} />)}
        {view === 'week' && <WeekView tasks={filtered} allTasks={tasks} act={act} anchor={weekAnchor} setAnchor={setWeekAnchor} showWeekend={showWeekend} setShowWeekend={setShowWeekend} focusId={focusId} isMobile={isMobile} filter={stFilter} setFilter={setStFilter} />}
        {view === 'month' && <MonthView tasks={filtered} act={act} anchor={monthAnchor} setAnchor={setMonthAnchor} goWeek={goWeek} />}
        {view === 'list' && <ListView tasks={filtered} act={act} filter={stFilter} setFilter={setStFilter} />}
        {view === 'mail' && <MailView />}
      </main>

      {isMobile && view !== 'mail' && <button className="fab" onClick={() => act.newTask({ date: view === 'today' ? agendaDay : null })} aria-label="משימה חדשה"><Icon name="plus" /></button>}

      <Ticker tasks={tasks} onPick={pickFromTicker} />

      {isMobile && (
        <nav className="tabbar" aria-label="תצוגות">
          {views.map(([k, l, ic]) => <button key={k} aria-pressed={view === k} onClick={() => setView(k)}><Icon name={ic} />{l}</button>)}
        </nav>
      )}

      {drawerTask && !editing && <TaskDrawer t={drawerTask} act={act} onClose={() => setDrawerId(null)} />}
      {editing && <EditForm initial={editing} act={act} onClose={() => setEditing(null)} />}
      {pushOpen && <PushPanel sb={sb} toast={toast} onClose={() => setPushOpen(false)} onChange={pushCheck} />}
      {shareCtx && <ShareSheet task={shareCtx.task ? (tasks.find((t) => t.id === shareCtx.task.id) || shareCtx.task) : null} tasks={tasks} onClose={() => setShareCtx(null)} toast={toast} />}
      {confirm && <ConfirmDialog text={confirm.text} onYes={confirm.onYes} onNo={() => setConfirm(null)} />}
      {toastMsg && <div className="toast" role="status">{toastMsg}</div>}
    </>
  );
}

/* ================= כניסה (Supabase) ================= */
function Login({ sb }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [mode, setMode] = useState('password');
  const [state, setState] = useState('idle');
  const [err, setErr] = useState('');
  const send = async (e) => {
    e.preventDefault(); setErr(''); setState('sending');
    if (mode === 'password') {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
      if (error) { setErr(error.message === 'Invalid login credentials' ? 'מייל או סיסמה שגויים. אם עוד לא הגדרת סיסמה – היכנס עם קישור למייל.' : error.message); setState('idle'); }
      return;
    }
    const { error } = await sb.auth.signInWithOtp({ email: email.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { setErr(error.message); setState('idle'); } else setState('sent');
  };
  return (
    <div className="panel login">
      <div className="brand" style={{ marginBottom: 16 }}><span className="brand-mark"><Icon name="check" /></span>המשימות של נדב</div>
      {state === 'sent' ? (
        <><h1>בדוק את המייל</h1><p className="sub" style={{ fontSize: 15 }}>שלחנו קישור כניסה אל {email}. אפשר לפתוח אותו בכל דפדפן.</p>
          <button className="btn" onClick={() => setState('idle')}>שליחה מחדש</button></>
      ) : (
        <form onSubmit={send}>
          <h1>כניסה</h1>
          <div role="group" aria-label="אופן כניסה" style={{ display: 'flex', gap: 4, background: '#F4F3EF', borderRadius: 10, padding: 3, margin: '8px 0 14px' }}>
            <button type="button" className="btn" aria-pressed={mode === 'password'} onClick={() => { setMode('password'); setErr(''); }} style={{ flex: 1, minHeight: 40, border: 0, background: mode === 'password' ? '#fff' : 'transparent', fontWeight: mode === 'password' ? 600 : 400 }}>מייל וסיסמה</button>
            <button type="button" className="btn" aria-pressed={mode === 'link'} onClick={() => { setMode('link'); setErr(''); }} style={{ flex: 1, minHeight: 40, border: 0, background: mode === 'link' ? '#fff' : 'transparent', fontWeight: mode === 'link' ? 600 : 400 }}>קישור למייל</button>
          </div>
          <p className="sub" style={{ fontSize: 14 }}>{mode === 'password' ? 'כניסה ראשונה? בחר "קישור למייל", ואחרי הכניסה תוכל להגדיר סיסמה.' : 'נשלח לך קישור כניסה למייל – אפשר לפתוח אותו בכל דפדפן.'}</p>
          <div className="fld"><label htmlFor="em" className="lbl">אימייל</label><input id="em" className="inp" type="email" dir="ltr" autoComplete="username" required value={email} onChange={(e) => setEmail(e.target.value)} /></div>
          {mode === 'password' && <div className="fld"><label htmlFor="pw" className="lbl">סיסמה</label><input id="pw" className="inp" type="password" dir="ltr" autoComplete="current-password" required value={pw} onChange={(e) => setPw(e.target.value)} /></div>}
          {err && <div className="err">{err}</div>}
          <button className="btn primary" type="submit" disabled={state === 'sending'} style={{ width: '100%' }}><Icon name={mode === 'password' ? 'check' : 'send'} sm />{state === 'sending' ? 'רגע…' : (mode === 'password' ? 'כניסה' : 'שלח קישור כניסה')}</button>
        </form>
      )}
    </div>
  );
}

/* ================= התראות בטלפון ================= */
const PUSH_FN = SUPABASE_URL + '/functions/v1/personal-task-reminders';
const b64ToU8 = (b) => { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function usePushState(sb) {
  const [st, setSt] = useState({ ready: false, on: false, endpoint: null });
  const check = useCallback(async () => {
    if (!sb || !pushSupported()) { setSt({ ready: true, on: false, endpoint: null }); return; }
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      setSt({ ready: true, on: !!sub && Notification.permission === 'granted', endpoint: sub ? sub.endpoint : null });
    } catch (e) { setSt({ ready: true, on: false, endpoint: null }); }
  }, [sb]);
  useEffect(() => { check(); }, [check]);
  return [st, check];
}

function PushPanel({ sb, onClose, toast, onChange }) {
  const [st, check] = usePushState(sb);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const needInstall = isIOS() && !isStandalone();
  const enable = async () => {
    setBusy(true); setMsg('');
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { setMsg('ההתראות נחסמו. צריך לאשר התראות לאתר בהגדרות הדפדפן ואז לנסות שוב.'); return; }
      const { publicKey } = await fetch(PUSH_FN).then((r) => r.json());
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
      const j = sub.toJSON();
      const { error } = await sb.from('personal_task_push_subs').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200) }, { onConflict: 'endpoint' });
      if (error) throw error;
      await check(); onChange && onChange();
      setMsg('ההתראות הופעלו במכשיר הזה.');
    } catch (e) { setMsg('ההפעלה נכשלה: ' + (e.message || e)); }
    finally { setBusy(false); }
  };
  const test = async () => {
    setBusy(true); setMsg('');
    try {
      const r = await fetch(PUSH_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ test: true, endpoint: st.endpoint }) }).then((x) => x.json());
      setMsg(r.result === 'sent' ? 'נשלחה התראת בדיקה. היא אמורה להופיע תוך כמה שניות.' : 'השליחה נכשלה. נסה לכבות ולהפעיל מחדש.');
    } catch (e) { setMsg('השליחה נכשלה: ' + (e.message || e)); }
    finally { setBusy(false); }
  };
  const disable = async () => {
    setBusy(true); setMsg('');
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await sb.from('personal_task_push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
      await check(); onChange && onChange();
      setMsg('ההתראות כובו במכשיר הזה.');
    } catch (e) { setMsg('הכיבוי נכשל: ' + (e.message || e)); }
    finally { setBusy(false); }
  };
  return (
    <Modal title="תזכורות בטלפון" onClose={onClose} size="sheet">
      {!pushSupported() && !needInstall && <p>הדפדפן הזה לא תומך בהתראות. בנייד אנדרואיד יש לפתוח בכרום.</p>}
      {needInstall ? (
        <div>
          <p style={{ marginTop: 0 }}>באייפון התראות עובדות רק כשהאפליקציה מותקנת במסך הבית:</p>
          <ol style={{ paddingInlineStart: 20, lineHeight: 1.7 }}>
            <li>בספארי, לחץ על כפתור השיתוף בתחתית המסך.</li>
            <li>בחר "הוסף למסך הבית".</li>
            <li>פתח את האפליקציה מהאייקון החדש, וחזור לכאן כדי להפעיל.</li>
          </ol>
        </div>
      ) : pushSupported() && (
        <div>
          <p style={{ marginTop: 0 }}>{st.on ? 'ההתראות פעילות במכשיר הזה.' : 'הפעל פעם אחת בכל מכשיר שבו תרצה לקבל תזכורות.'}</p>
          <p className="sub" style={{ marginTop: 0 }}>את זמן התזכורת בוחרים בעריכת המשימה. כששמים תאריך או שעה חדשים, התזכורת זזה איתם לבד.</p>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {!st.on && <button className="btn primary" onClick={enable} disabled={busy || !st.ready}><Icon name="bell" sm />הפעלת התראות</button>}
            {st.on && <button className="btn primary" onClick={test} disabled={busy}><Icon name="send" sm />שלח התראת בדיקה</button>}
            {st.on && <button className="btn" onClick={disable} disabled={busy}>כיבוי במכשיר הזה</button>}
          </div>
        </div>
      )}
      {msg && <p role="status" style={{ marginBottom: 0 }}>{msg}</p>}
    </Modal>
  );
}

function SupabaseRoot() {
  const sb = useMemo(() => window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit', storageKey: 'nadav-tasks-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }), []);
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data } = sb.auth.onAuthStateChange((_e, s) => setSession(s || null));
    return () => data.subscription.unsubscribe();
  }, [sb]);
  const userId = session && session.user && session.user.id;
  const store = useMemo(() => userId ? createSupabaseStore(sb, session.user) : null, [userId]);
  if (session === undefined) return <div className="login sub">טוען…</div>;
  if (!session) return <Login sb={sb} />;
  return <>
    <PasswordSetup sb={sb} user={session.user} />
    <App store={store} user={session.user} sb={sb} onLogout={() => sb.auth.signOut()} />
  </>;
}

function PasswordSetup({ sb, user }) {
  const meta = (user && user.user_metadata) || {};
  const key = 'pwbar-dismissed-' + (user && user.id);
  const [hidden, setHidden] = useState(() => { try { return !!meta.has_password || localStorage.getItem(key) === '1'; } catch (e) { return !!meta.has_password; } });
  const [pw, setPw] = useState('');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  if (hidden) return null;
  const dismiss = () => { try { localStorage.setItem(key, '1'); } catch (e) {} setHidden(true); };
  const save = async (e) => {
    e.preventDefault();
    if (pw.length < 8) { setMsg('לפחות 8 תווים'); return; }
    setBusy(true); setMsg('');
    const { error } = await sb.auth.updateUser({ password: pw, data: { has_password: true } });
    setBusy(false);
    if (error) setMsg(error.message); else { setMsg('נשמר. מעכשיו אפשר להתחבר עם מייל וסיסמה מכל דפדפן.'); setTimeout(dismiss, 2500); }
  };
  return (
    <form onSubmit={save} style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 8, padding: '10px 16px', background: '#E9EEF9', borderBottom: '1px solid #C9D6F2', fontSize: 14 }}>
      <span style={{ fontWeight: 600 }}>הגדר סיסמה כדי להתחבר מכל דפדפן ומהאייפון:</span>
      <label htmlFor="newpw" className="sr-only" style={{ position: 'absolute', width: 1, height: 1, overflow: 'hidden', clip: 'rect(0 0 0 0)' }}>סיסמה חדשה</label>
      <input id="newpw" className="inp" type="password" dir="ltr" autoComplete="new-password" placeholder="סיסמה חדשה (8+ תווים)" value={pw} onChange={(e) => setPw(e.target.value)} style={{ maxWidth: 240, height: 40 }} />
      <button className="btn primary" type="submit" disabled={busy} style={{ minHeight: 40 }}>{busy ? 'שומר…' : 'שמירה'}</button>
      <button className="btn" type="button" onClick={dismiss} style={{ minHeight: 40 }}>לא עכשיו</button>
      {msg && <span role="status">{msg}</span>}
    </form>
  );
}

function Root() {
  const localStore = useMemo(() => CONFIGURED ? null : createLocalStore(), []);
  if (!CONFIGURED) return <App store={localStore} />;
  if (!window.supabase) return <div className="panel login"><h1>שגיאה</h1><p>ספריית Supabase לא נטענה. בדוק חיבור לאינטרנט.</p></div>;
  return <SupabaseRoot />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}));
  // כשיוצאת גרסה חדשה – טעינה מחדש אוטומטית פעם אחת
  let swReloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !swReloaded) { swReloaded = true; location.reload(); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {}); });
}
